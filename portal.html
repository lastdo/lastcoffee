<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lastcoffee | 巴哈普查入口</title>
    <style>
      :root {
        --bg1: #f2efe7;
        --bg2: #e4ece2;
        --text: #1f2a22;
        --muted: #5b675f;
        --accent: #1f7a5a;
        --accent-strong: #14583f;
        --line: #cad5c7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 10%, #ffffffaa 0, #ffffff00 38%),
          linear-gradient(140deg, var(--bg1), var(--bg2));
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .panel {
        width: min(780px, 100%);
        background: #fffffff0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: clamp(20px, 4vw, 34px);
      }
      .eyebrow { margin: 0; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      h1 { margin: 8px 0 6px; font-size: clamp(1.5rem, 3.8vw, 2.3rem); }
      p { margin: 0 0 14px; color: var(--muted); line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid transparent;
        text-decoration: none;
        font-weight: 800;
      }
      .btn.primary { color: #fff; background: var(--accent); }
      .btn.primary:hover { background: var(--accent-strong); }
      .btn.ghost { color: var(--text); background: #fff; border-color: var(--line); }
      .links { margin-top: 16px; font-size: 0.95rem; color: var(--muted); }
      code { padding: 2px 6px; background: #edf3ed; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">lastcoffee</p>
      <h1>巴哈耳機普查</h1>
      <p>這是正式填寫入口。一般使用者請從下方「開始填寫」進入，管理者使用「管理入口」。</p>
      <div class="actions">
        <a class="btn primary" href="/lastcoffee">開始填寫</a>
        <a class="btn ghost" href="/lastcoffee/admin">管理入口</a>
      </div>
      <div class="links">
        固定入口路徑：<code>/lastcoffee</code> ・ 管理路徑：<code>/lastcoffee/admin</code>
      </div>
    </main>
  </body>
</html>
